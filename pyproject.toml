[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "math-beamer"
version = "0.1.0"
description = "Generate English Beamer talks in mathematics with a slide budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
math-beamer = "mathbeamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathbeamer = ["assets/*.sty", "assets/*.json"]
